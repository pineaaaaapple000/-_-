
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>INFECTION MOBILE</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#05080c;color:white;font-family:Arial,sans-serif;
 touch-action:none;user-select:none;
}
canvas{display:block}
#game{position:absolute;inset:0}
#hud{position:absolute;inset:0;pointer-events:none}
#top{
 position:absolute;top:env(safe-area-inset-top,8px);
 left:0;width:100%;display:flex;justify-content:space-around;
 padding:12px 8px;font-size:12px;font-weight:bold;
 text-shadow:0 2px 5px black;
}
.info{background:#0009;border:1px solid #ffffff20;padding:7px 12px;border-radius:8px}
#hp{color:#ff5757}
#ammo{color:#ffd45b}
#kills{color:#69e6ff}
#cross{
 position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 font-size:25px;color:#ffffffaa;font-weight:200;
}
#cross:after{content:"+"}
#hit{
 position:absolute;inset:0;border:0 solid #ff0000;
 transition:border-width .08s;pointer-events:none
}
#damage{
 position:absolute;inset:0;background:#ff000044;opacity:0;
 transition:opacity .15s
}
#weapon{
 position:absolute;bottom:12%;right:-4%;
 width:44%;height:35%;pointer-events:none;
}
#weapon:before{
 content:"";position:absolute;right:10%;bottom:0;
 width:60%;height:75%;
 background:linear-gradient(90deg,#111,#30343a,#090a0c);
 clip-path:polygon(25% 0,70% 0,100% 100%,0 100%);
 border:1px solid #555;
}
#weapon:after{
 content:"";position:absolute;right:35%;bottom:70%;
 width:20%;height:40%;
 background:linear-gradient(#555,#171717);
 transform:rotate(-8deg);
}
#flash{
 position:absolute;right:25%;bottom:32%;
 width:80px;height:80px;
 background:radial-gradient(circle,#fff 0%,#ffe56b 20%,#ff8b18 45%,transparent 70%);
 opacity:0;transform:scale(.5);
}
#stick{
 position:absolute;left:20px;bottom:35px;
 width:145px;height:145px;border-radius:50%;
 background:#ffffff12;border:2px solid #ffffff35;
 pointer-events:auto;touch-action:none;
}
#knob{
 position:absolute;width:58px;height:58px;left:41px;top:41px;
 border-radius:50%;background:#ffffff50;border:2px solid #ffffff80;
}
.btn{
 pointer-events:auto;touch-action:none;position:absolute;
 display:flex;align-items:center;justify-content:center;
 background:#101820bb;border:2px solid #ffffff55;
 color:white;border-radius:50%;font-weight:bold;
 text-shadow:0 1px 4px black;
}
#fire{right:22px;bottom:65px;width:95px;height:95px;
 background:#a52b2b99;border-color:#ffaaaa;font-size:17px}
#reload{right:115px;bottom:35px;width:65px;height:65px;font-size:12px}
#jump{right:28px;bottom:180px;width:65px;height:65px;font-size:12px}
#sprint{left:35px;bottom:195px;width:65px;height:65px;font-size:11px}
#message{
 position:absolute;left:50%;top:35%;transform:translate(-50%,-50%);
 text-align:center;font-size:22px;font-weight:bold;
 text-shadow:0 3px 8px black;white-space:pre-line
}
#start{
 position:absolute;inset:0;background:#05080cee;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;text-align:center;z-index:10;
}
#start h1{font-size:42px;letter-spacing:6px;color:#e22;margin:0}
#start p{color:#aaa;font-size:13px;line-height:2}
#start button{
 background:#a21d1d;color:white;border:0;border-radius:8px;
 padding:18px 50px;font-size:20px;font-weight:bold;margin-top:25px
}
#loading{color:#777;font-size:12px;margin-top:15px}
#reloadbar{
 position:absolute;left:50%;bottom:28%;transform:translateX(-50%);
 width:140px;height:8px;background:#222;border:1px solid #aaa;
 display:none;border-radius:4px;overflow:hidden
}
#reloadfill{width:0;height:100%;background:#ffd45b}
#gameover{
 position:absolute;inset:0;background:#000c;
 display:none;align-items:center;justify-content:center;
 flex-direction:column;text-align:center
}
#gameover h1{color:#e33;font-size:38px}
#gameover button{padding:15px 35px;background:#a22;color:white;border:0;border-radius:8px;font-size:18px}
</style>
</head>

<body>
<div id="game"></div>

<div id="hud">
 <div id="top">
  <div class="info" id="hp">HP 100</div>
  <div class="info" id="ammo">30 / 90</div>
  <div class="info" id="kills">KILL 0</div>
  <div class="info" id="time">TIME 180</div>
 </div>

 <div id="cross"></div>
 <div id="damage"></div>
 <div id="hit"></div>

 <div id="weapon"><div id="flash"></div></div>

 <div id="stick"><div id="knob"></div></div>
 <div class="btn" id="fire">FIRE</div>
 <div class="btn" id="reload">RELOAD</div>
 <div class="btn" id="jump">JUMP</div>
 <div class="btn" id="sprint">SPRINT</div>

 <div id="reloadbar"><div id="reloadfill"></div></div>
 <div id="message"></div>
</div>

<div id="start">
 <h1>INFECTION</h1>
 <p>MOBILE SURVIVAL FPS<br>
  ZOMBIE INFECTION<br><br>
  左スティック：移動<br>
  右画面スワイプ：視点操作<br>
  FIRE：射撃 / RELOAD：リロード
 </p>
 <button id="startbtn">START GAME</button>
 <div id="loading"></div>
</div>

<div id="gameover">
 <h1>MISSION FAILED</h1>
 <p id="result"></p>
 <button id="restart">RETRY</button>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const $=id=>document.getElementById(id);

let scene,camera,renderer,clock;
let running=false;
let hp=100,ammo=30,reserve=90,kills=0;
let timeLeft=180;
let zombies=[],walls=[],bullets=[];
let moveX=0,moveY=0;
let yaw=0,pitch=0;
let velocityY=0,grounded=true;
let firing=false,reloading=false,sprinting=false;
let fireTimer=0,spawnTimer=0;
let recoil=0,weaponBob=0;
let lastTime=0;
const raycaster=new THREE.Raycaster();
const forward=new THREE.Vector3();
const right=new THREE.Vector3();
const moveDir=new THREE.Vector3();
const tempVec=new THREE.Vector3();
const WORLD=45;

function mat(color,roughness=1){
 return new THREE.MeshStandardMaterial({color,roughness});
}

function box(x,y,z,sx,sy,sz,material){
 const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);
 m.position.set(x,y,z);
 m.castShadow=true;m.receiveShadow=true;
 scene.add(m);
 return m;
}

function createWorld(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x080d15);
 scene.fog=new THREE.Fog(0x080d15,15,65);

 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);
 camera.position.set(0,1.7,0);
 camera.rotation.order='YXZ';
 scene.add(camera);

 const hemi=new THREE.HemisphereLight(0x8094b4,0x202020,1.2);
 scene.add(hemi);

 const light=new THREE.DirectionalLight(0xffffff,1.5);
 light.position.set(8,20,5);
 light.castShadow=true;
 light.shadow.mapSize.set(1024,1024);
 light.shadow.camera.left=-35;
 light.shadow.camera.right=35;
 light.shadow.camera.top=35;
 light.shadow.camera.bottom=-35;
 scene.add(light);

 const floor=box(0,-.2,0,90,.4,90,mat(0x30363b));
 floor.receiveShadow=true;

 // 工場の壁
 const wallmat=mat(0x40464c);
 box(0,3,-25,50,6,1,wallmat);
 box(0,3,25,50,6,1,wallmat);
 box(-25,3,0,1,6,50,wallmat);
 box(25,3,0,1,6,50,wallmat);

 // 柱
 const colmat=mat(0x555b60);
 for(let x=-20;x<=20;x+=10){
  for(let z=-20;z<=20;z+=10){
   box(x,3,z,1,6,1,colmat);
  }
 }

 // コンテナ
 const crate=mat(0x46515b);
 const crate2=mat(0x333c45);
 for(let i=0;i<16;i++){
  const x=(Math.random()-.5)*36;
  const z=(Math.random()-.5)*36;
  if(Math.abs(x)<4&&Math.abs(z)<5)continue;
  const w=2+Math.random()*2;
  const h=1.5+Math.random()*2;
  box(x,h/2,z,w,h,2+Math.random()*2,
      Math.random()<.5?crate:crate2);
 }

 // ライトの光
 for(let x=-15;x<=15;x+=10){
  const lamp=new THREE.PointLight(0x9cb8ff,15,14);
  lamp.position.set(x,5,0);
  scene.add(lamp);
 }
}

function createZombie(x,z){
 const group=new THREE.Group();
 group.position.set(x,0,z);
 scene.add(group);

 const skin=mat(0x687d68);
 const dark=mat(0x263329);
 const shirt=mat(0x3c493d);
 const pants=mat(0x24282b);
 const red=mat(0xff1717);

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(.65,.85,.35),shirt);
 body.position.y=1.15;group.add(body);

 const head=new THREE.Mesh(
  new THREE.BoxGeometry(.45,.45,.45),skin);
 head.position.y=1.85;group.add(head);

 const eye1=new THREE.Mesh(
  new THREE.BoxGeometry(.07,.06,.04),red);
 eye1.position.set(-.11,1.9,-.23);group.add(eye1);
 const eye2=eye1.clone();
 eye2.position.x=.11;group.add(eye2;

 const legs=[];
 for(let i=0;i<2;i++){
  const leg=new THREE.Mesh(
   new THREE.BoxGeometry(.22,.65,.25),pants);
  leg.position.set(i===0?-.17:.17,.4,0);
  group.add(leg);legs.push(leg);
 }

 const arms=[];
 for(let i=0;i<2;i++){
  const arm=new THREE.Mesh(
   new THREE.BoxGeometry(.2,.7,.2),skin);
  arm.position.set(i===0?-.45:.45,1.2,0);
  group.add(arm);arms.push(arm);
 }

 group.userData={
  hp:100,speed:1.0+Math.random()*.4,
  legs,arms,body,head,attack:0,
  alive:true,phase:Math.random()*6
 };
 zombies.push(group);
 return group;
}

function resetGame(){
 zombies.forEach(z=>scene.remove(z));
 zombies=[];
 bullets.forEach(b=>scene.remove(b.mesh));
 bullets=[];

 hp=100;ammo=30;reserve=90;kills=0;
 timeLeft=180;spawnTimer=0;
 reloading=false;firing=false;
 camera.position.set(0,1.7,0);
 yaw=0;pitch=0;velocityY=0;
 grounded=true;

 for(let i=0;i<8;i++){
  const a=Math.random()*Math.PI*2;
  const r=12+Math.random()*15;
  createZombie(Math.cos(a)*r,Math.sin(a)*r);
 }
 updateHUD();
}

function updateHUD(){
 $('hp').textContent='HP '+Math.max(0,Math.floor(hp));
 $('ammo').textContent=ammo+' / '+reserve;
 $('kills').textContent='KILL '+kills;
 $('time').textContent='TIME '+Math.ceil(timeLeft);
}

function shoot(){
 if(!running||reloading)return;
 if(ammo<=0){reload();return}
 ammo--;
 recoil=.12;
 $('flash').style.opacity=1;
 $('flash').style.transform='scale(1.3)';
 setTimeout(()=>{
  $('flash').style.opacity=0;
  $('flash').style.transform='scale(.5)';
 },60);

 // 照準方向へ射撃
 raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
 const targets=[];
 zombies.forEach(z=>{
  if(z.userData.alive){
   z.traverse(o=>{if(o.isMesh)targets.push(o)});
  }
 });
 const hits=raycaster.intersectObjects(targets,false);

 if(hits.length){
  let obj=hits[0].object;
  let z=obj;
  while(z&& !z.userData.hp)z=z.parent;
  if(z&&z.userData.alive){
   z.userData.hp-=35;
   z.userData.body.material=mat(0x995555);
   setTimeout(()=>{
    if(z.userData.alive)z.userData.body.material=mat(0x3c493d);
   },100);
   if(z.userData.hp<=0){
    z.userData.alive=false;
    scene.remove(z);
    kills++;
   }
  }
 }
 updateHUD();
}

function reload(){
 if(reloading||ammo===30||reserve<=0||!running)return;
 reloading=true;firing=false;
 $('reloadbar').style.display='block';
 $('reloadfill').style.width='0%';
 const start=performance.now();
 const duration=1600;

 function tick(now){
  if(!reloading)return;
  const p=Math.min(1,(now-start)/duration);
  $('reloadfill').style.width=(p*100)+'%';
  if(p<1)requestAnimationFrame(tick);
  else{
   const n=Math.min(30-ammo,reserve);
   ammo+=n;reserve-=n;
   reloading=false;
   $('reloadbar').style.display='none';
   updateHUD();
  }
 }
 requestAnimationFrame(tick);
}

function damage(amount){
 hp-=amount;
 $('damage').style.opacity=.7;
 $('hit').style.borderWidth='15px';
 setTimeout(()=>{
  $('damage').style.opacity=0;
  $('hit').style.borderWidth='0';
 },150);
 updateHUD();
 if(hp<=0)endGame();
}

function endGame(){
 running=false;
 firing=false;
 $('gameover').style.display='flex';
 $('result').textContent='KILLS: '+kills;
}

function updateZombies(dt){
 zombies.forEach(z=>{
  const d=z.userData;
  if(!d.alive)return;

  const dx=camera.position.x-z.position.x;
  const dz=camera.position.z-z.position.z;
  const dist=Math.sqrt(dx*dx+dz*dz);

  if(dist>1.2){
   z.position.x+=dx/dist*d.speed*dt;
   z.position.z+=dz/dist*d.speed*dt;
   z.rotation.y=Math.atan2(dx,dz);
  }else{
   d.attack-=dt;
   if(d.attack<=0){
    damage(8);
    d.attack=1;
   }
  }

  d.phase+=dt*7;
  d.legs[0].rotation.x=Math.sin(d.phase)*.7;
  d.legs[1].rotation.x=-Math.sin(d.phase)*.7;
  d.arms[0].rotation.x=-1+Math.sin(d.phase)*.3;
  d.arms[1].rotation.x=-1-Math.sin(d.phase)*.3;
 });
}

function update(dt){
 if(!running)return;
 timeLeft-=dt;
 if(timeLeft<=0){endGame();return}

 if(firing){
  fireTimer-=dt;
  if(fireTimer<=0){
   shoot();fireTimer=.11;
  }
 }

 // 移動
 const speed=sprinting?8:4.5;
 forward.set(-Math.sin(yaw),0,-Math.cos(yaw));
 right.set(Math.cos(yaw),0,-Math.sin(yaw));
 moveDir.set(0,0,0);
 moveDir.addScaledVector(forward,-moveY);
 moveDir.addScaledVector(right,moveX);
 if(moveDir.length()>1)moveDir.normalize();

 camera.position.addScaledVector(moveDir,speed*dt);

 // 壁の外に出ない
 camera.position.x=Math.max(-23,Math.min(23,camera.position.x));
 camera.position.z=Math.max(-23,Math.min(23,camera.position.z));

 velocityY-=18*dt;
 camera.position.y+=velocityY*dt;
 if(camera.position.y<=1.7){
  camera.position.y=1.7;
  velocityY=0;grounded=true;
 }

 recoil=Math.max(0,recoil-dt*.8);
 weaponBob+=dt*(moveDir.length()>0?12:3);
 camera.rotation.set(pitch-recoil,yaw,0,'YXZ');

 updateZombies(dt);
 updateHUD();
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);
 update(dt);
 renderer.render(scene,camera);
}

function init(){
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 $('game').appendChild(renderer.domElement);

 clock=new THREE.Clock();
 createWorld();
 resetGame();
 animate();
}

// スマホ視点操作
let lookPointer=null,lastLookX=0,lastLookY=0;
document.addEventListener('pointerdown',e=>{
 if(e.target.closest('.btn')||e.target.closest('#stick'))return;
 if(!running)return;
 lookPointer=e.pointerId;
 lastLookX=e.clientX;
 lastLookY=e.clientY;
});
document.addEventListener('pointermove',e=>{
 if(e.pointerId!==lookPointer)return;
 const dx=e.clientX-lastLookX;
 const dy=e.clientY-lastLookY;
 lastLookX=e.clientX;lastLookY=e.clientY;
 yaw-=dx*.004;
 pitch-=dy*.004;
 pitch=Math.max(-1.35,Math.min(1.35,pitch));
});
document.addEventListener('pointerup',e=>{
 if(e.pointerId===lookPointer)lookPointer=null;
});
document.addEventListener('pointercancel',()=>lookPointer=null);

// 移動スティック
const stick=$('stick'),knob=$('knob');
let stickPointer=null;
stick.addEventListener('pointerdown',e=>{
 stickPointer=e.pointerId;
 stick.setPointerCapture(e.pointerId);
 handleStick(e);
});
stick.addEventListener('pointermove',e=>{
 if(e.pointerId===stickPointer)handleStick(e);
});
function handleStick(e){
 const r=stick.getBoundingClientRect();
 let x=e.clientX-(r.left+r.width/2);
 let y=e.clientY-(r.top+r.height/2);
 const max=48;
 const len=Math.sqrt(x*x+y*y);
 if(len>max){x=x/len*max;y=y/len*max}
 knob.style.transform=`translate(${x}px,${y}px)`;
 moveX=x/max;moveY=y/max;
}
function resetStick(){
 stickPointer=null;moveX=0;moveY=0;
 knob.style.transform='translate(0,0)';
}
stick.addEventListener('pointerup',resetStick);
stick.addEventListener('pointercancel',resetStick);

// 射撃ボタン
$('fire').addEventListener('pointerdown',e=>{
 e.preventDefault();firing=true;shoot();fireTimer=.11;
});
$('fire').addEventListener('pointerup',()=>firing=false);
$('fire').addEventListener('pointercancel',()=>firing=false);
$('fire').addEventListener('pointerleave',()=>firing=false);

// リロード
$('reload').addEventListener('pointerdown',e=>{
 e.preventDefault();reload();
});

// ジャンプ
$('jump').addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(grounded&&running){
  velocityY=7;grounded=false;
 }
});

// ダッシュ
$('sprint').addEventListener('pointerdown',e=>{
 e.preventDefault();sprinting=true;
});
$('sprint').addEventListener('pointerup',()=>sprinting=false);
$('sprint').addEventListener('pointercancel',()=>sprinting=false);
$('sprint').addEventListener('pointerleave',()=>sprinting=false);

// 開始
$('startbtn').onclick=()=>{
 $('start').style.display='none';
 $('gameover').style.display='none';
 running=true;
 resetGame();
};
$('restart').onclick=()=>{
 $('gameover').style.display='none';
 resetGame();
 running=true;
};

// リサイズ
addEventListener('resize',()=>{
 if(!camera||!renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

init();
</script>
</body>
</html>
