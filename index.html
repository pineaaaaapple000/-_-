<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>INFECTION - Browser FPS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080c;color:white;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
canvas{display:block}#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#05091277,#050912bb),radial-gradient(circle at 50% 30%,#263442,#07090d 70%);z-index:5}
.card{text-align:center;width:min(90%,430px);padding:28px;border:1px solid #ffffff25;background:#080b10cc;backdrop-filter:blur(8px);border-radius:14px;box-shadow:0 0 40px #000}
h1{font-size:clamp(42px,12vw,72px);letter-spacing:5px;margin:0;color:#eee;text-shadow:3px 3px #a00,0 0 22px #f002;font-weight:1000}
.sub{color:#f44;letter-spacing:5px;margin:0 0 25px}.btn{width:100%;padding:14px;margin:7px 0;background:#171d25;border:1px solid #68717b;color:#fff;font-size:17px;border-radius:7px;font-weight:bold}.btn:active{background:#8d1119}
#hud{position:absolute;inset:0;pointer-events:none;display:none}
#top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;font-weight:bold;text-shadow:0 2px 4px #000}
.panel{background:#05080bbd;border:1px solid #ffffff22;padding:8px 12px;border-radius:8px}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:25px;color:#fff}
#bottom{position:absolute;bottom:18px;left:16px;font-size:20px;font-weight:bold;text-shadow:0 2px 5px #000}
#ammo{position:absolute;right:18px;bottom:18px;font-size:23px;font-weight:bold;text-shadow:0 2px 5px #000}
#msg{position:absolute;top:28%;width:100%;text-align:center;color:#ff4c4c;font-size:26px;font-weight:bold;text-shadow:0 3px 7px #000}
#stick{position:absolute;bottom:35px;left:35px;width:125px;height:125px;border:2px solid #ffffff55;border-radius:50%;background:#ffffff12;pointer-events:auto;display:none}
#nub{position:absolute;width:52px;height:52px;border-radius:50%;background:#ffffff66;left:35px;top:35px}
#fire{position:absolute;bottom:55px;right:35px;width:90px;height:90px;border-radius:50%;background:#aa152a99;border:2px solid #ff8a8a;display:none;pointer-events:auto;font-size:18px;font-weight:bold}
#restart{display:none}
@media(pointer:coarse){#stick,#fire{display:block}}
</style></head><body>
<div id="menu"><div class="card"><h1>INFECTION</h1><div class="sub">ZOMBIE FPS // PROTOTYPE</div>
<button class="btn" id="start">クイックスタート</button><button class="btn" id="how">操作方法</button><div id="help" style="display:none;color:#bbb;font-size:13px;line-height:1.8;margin-top:10px">PC：WASD移動 / マウス視点 / 左クリック射撃 / Rリロード<br>スマホ：左スティック移動 / 画面スワイプ視点 / FIRE射撃</div>
<div style="color:#77808b;font-size:11px;margin-top:15px">OFFLINE BROWSER DEMO • Three.js</div></div></div>
<div id="hud"><div id="top"><div class="panel">INFECTION<br><span style="color:#9ba8b8;font-size:12px">OFFLINE</span></div><div class="panel"><span style="color:#4bd5ff">HUMAN <span id="hum">1</span></span>　<span style="color:#ff3e4e">ZOMBIE <span id="zom">5</span></span><br><span id="timer">05:00</span></div></div><div id="cross">＋</div><div id="msg"></div><div id="bottom" class="panel">♥ <span id="hp">100</span>　▰ <span id="kills">0</span> KILLS</div><div id="ammo" class="panel">30 / 90</div>
<div id="stick"><div id="nub"></div></div><button id="fire">FIRE</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
let scene,camera,renderer,clock,started=false,health=100,ammo=30,reserve=90,kills=0,time=300,playerYaw=0,playerPitch=0;
const keys={},zombies=[],bullets=[];let moveTouch={x:0,y:0},lookTouch=null,lastShot=0;
const menu=document.querySelector('#menu'),hud=document.querySelector('#hud'),msg=document.querySelector('#msg');
function init(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x101925);scene.fog=new THREE.Fog(0x101925,18,65);
 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,100);camera.position.set(0,1.7,8);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0x9baec8,0x252018,2));
 const light=new THREE.DirectionalLight(0xffe0b0,2);light.position.set(8,15,5);scene.add(light);
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x30343a,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=0;scene.add(floor);
 // industrial arena walls and crates
 const wallmat=new THREE.MeshStandardMaterial({color:0x454a50,roughness:.9}),crateMat=new THREE.MeshStandardMaterial({color:0x59412d});
 function box(x,y,z,sx,sy,sz,mat){let m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);m.position.set(x,y,z);scene.add(m);return m}
 box(0,3,-28,60,6,1,wallmat);box(0,3,28,60,6,1,wallmat);box(-28,3,0,1,6,56,wallmat);box(28,3,0,1,6,56,wallmat);
 for(let i=0;i<14;i++){let x=(Math.random()-.5)*42,z=(Math.random()-.5)*38;if(Math.abs(x)<5&&z>0)continue;box(x,.8,z,1.8,1.6,1.8,crateMat)}
 // rifle-like viewmodel
 const gun=new THREE.Group();const metal=new THREE.MeshStandardMaterial({color:0x171b20,metalness:.7,roughness:.35});
 let body=new THREE.Mesh(new THREE.BoxGeometry(.18,.16,.65),metal);body.position.set(.34,-.28,-.65);gun.add(body);
 let barrel=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.55,8),metal);barrel.rotation.x=Math.PI/2;barrel.position.set(.34,-.25,-1.08);gun.add(barrel);
 camera.add(gun);scene.add(camera);
 for(let i=0;i<5;i++)spawnZombie();
 clock=new THREE.Clock();animate();
}
function spawnZombie(){
 const g=new THREE.Group(),skin=new THREE.MeshStandardMaterial({color:0x55745b}),dark=new THREE.MeshStandardMaterial({color:0x242a29}),eye=new THREE.MeshBasicMaterial({color:0xff2424});
 let torso=new THREE.Mesh(new THREE.BoxGeometry(.65,.9,.35),dark);torso.position.y=1.15;g.add(torso);
 let head=new THREE.Mesh(new THREE.SphereGeometry(.28,12,10),skin);head.position.y=1.8;g.add(head);
 for(let x of [-.12,.12]){let e=new THREE.Mesh(new THREE.SphereGeometry(.055,8,8),eye);e.position.set(x,1.83,-.23);g.add(e)}
 for(let x of [-.38,.38]){let arm=new THREE.Mesh(new THREE.BoxGeometry(.18,.75,.18),skin);arm.position.set(x,1.2,-.05);arm.rotation.z=x<0?-.25:.25;g.add(arm)}
 for(let x of [-.18,.18]){let leg=new THREE.Mesh(new THREE.BoxGeometry(.22,.7,.22),dark);leg.position.set(x,.35,0);g.add(leg)}
 let a=Math.random()*Math.PI*2,r=13+Math.random()*13;g.position.set(Math.cos(a)*r,0,Math.sin(a)*r);scene.add(g);zombies.push({g,hp:100,speed:1.15+Math.random()*.5,attack:0});
}
function shoot(){
 if(!started||ammo<=0)return;let now=performance.now();if(now-lastShot<140)return;lastShot=now;ammo--;document.querySelector('#ammo').textContent=`${ammo} / ${reserve}`;
 const dir=new THREE.Vector3();camera.getWorldDirection(dir);let ray=new THREE.Raycaster(camera.position,dir,0,35);
 const targets=[];zombies.forEach(z=>z.g.traverse(o=>{if(o.isMesh)targets.push(o)}));let hit=ray.intersectObjects(targets);
 // tracer flash
 let flash=new THREE.Mesh(new THREE.SphereGeometry(.045,6,6),new THREE.MeshBasicMaterial({color:0xffe8a0}));flash.position.copy(camera.position).addScaledVector(dir,1.4);scene.add(flash);setTimeout(()=>scene.remove(flash),45);
 if(hit.length){let z=zombies.find(z=>z.g===hit[0].object.parent||z.g.children.includes(hit[0].object));if(!z)z=zombies.find(z=>{let p=hit[0].object;while(p&&p.parent!==scene)p=p.parent;return p===z.g});if(z){z.hp-=38;if(z.hp<=0){scene.remove(z.g);zombies.splice(zombies.indexOf(z),1);kills++;document.querySelector('#kills').textContent=kills;spawnZombie();}}}
}
function reload(){if(ammo===30||reserve<=0)return;let n=Math.min(30-ammo,reserve);ammo+=n;reserve-=n;document.querySelector('#ammo').textContent=`${ammo} / ${reserve}`}
function animate(){
 requestAnimationFrame(animate);if(!started){renderer.render(scene,camera);return}
 let dt=Math.min(clock.getDelta(),.05);time-=dt;if(time<=0){end("TIME UP");}
 document.querySelector('#timer').textContent=`${String(Math.floor(time/60)).padStart(2,'0')}:${String(Math.max(0,Math.floor(time%60))).padStart(2,'0')}`;
 const f=(keys.KeyW?1:0)-(keys.KeyS?1:0)+(-moveTouch.y),s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+(moveTouch.x);
 let forward=new THREE.Vector3(-Math.sin(playerYaw),0,-Math.cos(playerYaw)),right=new THREE.Vector3(Math.cos(playerYaw),0,-Math.sin(playerYaw));
 camera.position.addScaledVector(forward,f*5*dt);camera.position.addScaledVector(right,s*5*dt);
 camera.position.x=Math.max(-26,Math.min(26,camera.position.x));camera.position.z=Math.max(-26,Math.min(26,camera.position.z));camera.position.y=1.7;
 camera.rotation.order='YXZ';camera.rotation.y=playerYaw;camera.rotation.x=playerPitch;
 zombies.forEach(z=>{let d=new THREE.Vector3().subVectors(camera.position,z.g.position);d.y=0;let dist=d.length();if(dist>1.15){d.normalize();z.g.position.addScaledVector(d,z.speed*dt);z.g.rotation.y=Math.atan2(d.x,d.z)}else{z.attack+=dt;if(z.attack>1){health-=8;z.attack=0;document.querySelector('#hp').textContent=health;if(health<=0)end("YOU WERE INFECTED");}}});
 renderer.render(scene,camera);
}
function start(){if(!renderer)init();started=true;menu.style.display='none';hud.style.display='block';health=100;time=300}
function end(t){started=false;msg.textContent=t;menu.style.display='flex';document.querySelector('#start').textContent='もう一度プレイ';setTimeout(()=>msg.textContent='',1800)}
document.querySelector('#start').onclick=start;document.querySelector('#how').onclick=()=>{let h=document.querySelector('#help');h.style.display=h.style.display==='none'?'block':'none'};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reload()});addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('resize',()=>{if(camera){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}});
rendererPointer();
function rendererPointer(){renderer?.domElement.addEventListener('click',()=>{if(started&&matchMedia('(pointer:fine)').matches)renderer.domElement.requestPointerLock?.()});document.addEventListener('mousemove',e=>{if(document.pointerLockElement&&started){playerYaw-=e.movementX*.002;playerPitch-=e.movementY*.002;playerPitch=Math.max(-1.3,Math.min(1.3,playerPitch))}})}
// touch joystick
const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(e.buttons)moveStick(e)});stick.addEventListener('pointerup',()=>{moveTouch={x:0,y:0};nub.style.transform='translate(0,0)'});
function moveStick(e){let r=stick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),len=Math.hypot(x,y),max=42;if(len>max){x=x/len*max;y=y/len*max}moveTouch={x:x/max,y:y/max};nub.style.transform=`translate(${x}px,${y}px)`}
document.querySelector('#fire').addEventListener('pointerdown',e=>{e.preventDefault();shoot()});
let prevTouch=null;addEventListener('touchstart',e=>{if(e.target.closest('#stick,#fire,.btn'))return;prevTouch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
addEventListener('touchmove',e=>{if(!prevTouch||e.target.closest('#stick'))return;let t=e.touches[0];playerYaw-=(t.clientX-prevTouch.x)*.006;playerPitch-=(t.clientY-prevTouch.y)*.006;playerPitch=Math.max(-1.3,Math.min(1.3,playerPitch));prevTouch={x:t.clientX,y:t.clientY}},{passive:true});
addEventListener('touchend',()=>prevTouch=null);
</script></body></html>
