
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>POCO UP!</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9fe5ff;font-family:system-ui,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 5px #526b88;font-weight:800}
#title{position:absolute;top:14px;left:14px;font-size:22px;letter-spacing:1px}
#status{position:absolute;top:48px;left:14px;font-size:13px}
#hint{position:absolute;top:14px;right:14px;font-size:12px;text-align:right}
#joyArea{position:absolute;left:18px;bottom:24px;width:140px;height:140px;pointer-events:auto;touch-action:none}
#joyBase{position:absolute;inset:0;border-radius:50%;background:#ffffff35;border:2px solid #ffffff80;backdrop-filter:blur(3px)}
#joyKnob{position:absolute;width:58px;height:58px;left:41px;top:41px;border-radius:50%;background:#ffffffb8;border:2px solid white;box-shadow:0 4px 12px #456}
#jump{position:absolute;right:25px;bottom:35px;width:92px;height:92px;border-radius:50%;border:3px solid #fff;background:#ffb72dcc;color:#fff;font-weight:900;font-size:18px;box-shadow:0 5px 0 #c77a22;pointer-events:auto;touch-action:none}
#jump:active{transform:translateY(4px);box-shadow:0 1px 0 #c77a22}
#centerMsg{position:absolute;top:45%;width:100%;text-align:center;font-size:28px;color:white;text-shadow:0 3px 8px #456;font-weight:900;opacity:0;transition:opacity .3s}
#restart{position:absolute;top:14px;right:14px;margin-top:45px;border:0;border-radius:12px;padding:9px 12px;background:#ffffffcc;color:#345;font-weight:800;pointer-events:auto}
@media(min-width:700px){#joyArea{width:160px;height:160px}#jump{width:105px;height:105px}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
 <div id="title">☁ POCO UP!</div>
 <div id="status">高さ 0 m　|　CP 0</div>
 <div id="hint">左：移動<br>右：視点<br>ボタン：ジャンプ</div>
 <div id="centerMsg"></div>
 <button id="restart">最初から</button>
 <div id="joyArea">
  <div id="joyBase"></div>
  <div id="joyKnob"></div>
 </div>
 <button id="jump">JUMP</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(()=>{
'use strict';

const canvas=document.querySelector('#game');
const status=document.querySelector('#status');
const msg=document.querySelector('#centerMsg');

if(!window.THREE){
 msg.textContent='通信して再読み込みしてください';
 msg.style.opacity=1;
 return;
}

// =========================
// 基本設定
// =========================
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9fe5ff);
scene.fog=new THREE.Fog(0x9fe5ff,35,150);

const camera=new THREE.PerspectiveCamera(
 70,innerWidth/innerHeight,.1,300
);

const renderer=new THREE.WebGLRenderer({
 canvas,
 antialias:true
});

renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;

// =========================
// 光
// =========================
scene.add(
 new THREE.HemisphereLight(0xffffff,0x75a4c5,1.5)
);

const sun=new THREE.DirectionalLight(0xffffff,1.25);
sun.position.set(-15,30,20);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

// =========================
// マテリアル
// =========================
const mat=(color,rough=.75)=>
 new THREE.MeshStandardMaterial({color,roughness:rough});

const mats=[
 0xff8b9b,
 0xffca65,
  0x70d9bb,
  0x83b8ff,
  0xc39aff,
  0xffa66d
].map(c=>mat(c));

const white=mat(0xffffff);
const dark=mat(0x37465b);
const skin=mat(0xffd3ad);
const eye=mat(0x202b3b);
const boxGeo=new THREE.BoxGeometry(1,1,1);

// =========================
// オブジェクト生成
// =========================
function box(x,y,z,sx,sy,sz,m){
 let o=new THREE.Mesh(boxGeo,m);
 o.position.set(x,y,z);
 o.scale.set(sx,sy,sz);
 o.castShadow=true;
 o.receiveShadow=true;
 scene.add(o);
 return o;
}

function sphere(x,y,z,sx,sy,sz,m){
 let o=new THREE.Mesh(
  new THREE.SphereGeometry(1,16,12),m
 );
 o.position.set(x,y,z);
 o.scale.set(sx,sy,sz);
 o.castShadow=true;
 scene.add(o);
 return o;
}

// =========================
// 雲
// =========================
for(let i=0;i<32;i++){
 let x=(Math.random()-.5)*100;
 let y=4+Math.random()*75;
 let z=(Math.random()-.5)*100;

 for(let j=0;j<3;j++){
  sphere(
   x+(j-1)*1.5,
   y+Math.random(),
   z,
   2.2,1.1,1.5,
   white
  );
 }
}

// =========================
// 足場コース
// =========================
const platforms=[];

function platform(x,y,z,w=3.5,d=3.5,color=0){
 let p=box(x,y,z,w,.45,d,mats[color%mats.length]);

 p.userData={
  x,y,z,w,d,
  top:y+.225
 };

 platforms.push(p);
 return p;
}

// スタート地点
platform(0,0,0,8,8,2);

// 上へ登るコース
const route=[
 [0,1.6,-6],
 [3,3.3,-10],
 [6,5,-7],
 [8,6.7,-2],
 [5,8.4,3],
 [1,10.1,6],
 [-3,11.8,3],
 [-6,13.5,-1],
 [-4,15.2,-6],
 [0,16.9,-9],
 [4,18.6,-6],
 [7,20.3,-1],
 [5,22,4],
 [1,23.7,7],
 [-3,25.4,4],
 [-6,27.1,0],
 [-4,28.8,-5],
 [0,30.5,-8],
 [4,32.2,-5],
 [7,33.9,0],
 [5,35.6,5],
 [1,37.3,8],
 [-3,39,5],
 [-6,40.7,1],
 [-3,42.4,-4],
 [1,44.1,-7],
 [5,45.8,-3],
 [7,47.5,2],
 [3,49.2,6],
 [0,51,0]
];

route.forEach((a,i)=>{
 platform(
  a[0],a[1],a[2],
  i%5===0?4.5:3.2,
  i%5===0?4.5:3.2,
  i+1
 );
});

// =========================
// チェックポイント
// =========================
const checkpoints=[8,17,25];
let cpIndex=0;

checkpoints.forEach(n=>{
 let a=route[n-1];

 box(
  a[0],a[1]+1.5,a[2],
  .18,2.7,.18,
  mat(0xffffff)
 );

 let flag=box(
  a[0]+.65,a[1]+2.35,a[2],
  1.2,.7,.12,
  mat(0xffdf58)
 );

 flag.rotation.z=-.12;
});

// =========================
// ゴール
// =========================
const last=route[route.length-1];

platform(
 last[0],last[1]+1.4,last[2],
 7,7,4
);

const ring=new THREE.Mesh(
 new THREE.TorusGeometry(2,.18,12,32),
 mat(0xffed70)
);

ring.position.set(
 last[0],last[1]+3.5,last[2]
);

scene.add(ring);

// =========================
// キャラクター
// =========================
const player=new THREE.Group();
scene.add(player);

// 体
const body=new THREE.Mesh(
 new THREE.CapsuleGeometry(.48,.75,4,8),
 mat(0x63b9ff)
);

body.position.y=1.05;
body.castShadow=true;
player.add(body);

// 頭
const head=sphere(
 0,1.85,0,
 .62,.58,.58,
 skin
);

player.add(head);

// 目
const eyeL=sphere(
 -.22,1.92,.49,
 .075,.11,.05,
 eye
);

const eyeR=sphere(
 .22,1.92,.49,
 .075,.11,.05,
 eye
);

player.add(eyeL,eyeR);

// 口
const mouth=sphere(
 0,1.72,.54,
 .12,.045,.035,
 mat(0xe97878)
);

player.add(mouth);

// ほっぺ
const cheek1=sphere(
 -.38,1.76,.43,
 .12,.07,.04,
 mat(0xff9eaa)
);

const cheek2=sphere(
 .38,1.76,.43,
 .12,.07,.04,
 mat(0xff9eaa)
);

player.add(cheek1,cheek2);

// 足
const feet=[];

for(let s of [-1,1]){
 let f=box(
  s*.23,.25,.08,
  .3,.25,.42,
  mat(0xffffff)
 );

 player.add(f);
 feet.push(f);
}

// =========================
// プレイヤー状態
// =========================
let pos=new THREE.Vector3(0,.25,0);
let vel=new THREE.Vector3();

let yaw=0;
let pitch=-.18;
let onGround=false;

let checkpointPos=new THREE.Vector3(0,.25,0);
let checkpointY=0;
let highest=0;
let won=false;

// =========================
// キー操作
// =========================
const keys={};

addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;

 if(e.key===' '){
  e.preventDefault();
  jump();
 }
});

addEventListener('keyup',e=>{
 keys[e.key.toLowerCase()]=false;
});

// =========================
// スマホスティック
// =========================
let joy={x:0,y:0};
let joyPointer=null;
let lookPointer=null;
let lastX=0,lastY=0;

const joyArea=document.querySelector('#joyArea');
const knob=document.querySelector('#joyKnob');

function joyMove(e){
 let r=joyArea.getBoundingClientRect();

 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);

 let lim=45;
 let len=Math.hypot(dx,dy);

 if(len>lim){
  dx=dx/len*lim;
  dy=dy/len*lim;
 }

 joy.x=dx/lim;
 joy.y=dy/lim;

 knob.style.transform=`translate(${dx}px,${dy}px)`;
}

joyArea.addEventListener('pointerdown',e=>{
 joyPointer=e.pointerId;
 joyArea.setPointerCapture(e.pointerId);
 joyMove(e);
});

joyArea.addEventListener('pointermove',e=>{
 if(e.pointerId===joyPointer)joyMove(e);
});

function joyEnd(e){
 if(e.pointerId===joyPointer){
  joyPointer=null;
  joy.x=joy.y=0;
  knob.style.transform='';
 }
}

joyArea.addEventListener('pointerup',joyEnd);
joyArea.addEventListener('pointercancel',joyEnd);

// =========================
// カメラ操作
// =========================
canvas.addEventListener('pointerdown',e=>{
 if(e.clientX>innerWidth*.42){
  lookPointer=e.pointerId;
  lastX=e.clientX;
  lastY=e.clientY;
  canvas.setPointerCapture(e.pointerId);
 }
});

canvas.addEventListener('pointermove',e=>{
 if(e.pointerId===lookPointer){
  yaw-=(e.clientX-lastX)*.005;

  pitch=Math.max(
   -1.05,
   Math.min(
    .45,
    pitch+(e.clientY-lastY)*.003
   )
  );

  lastX=e.clientX;
  lastY=e.clientY;
 }
});

function lookEnd(e){
 if(e.pointerId===lookPointer)lookPointer=null;
}

canvas.addEventListener('pointerup',lookEnd);
canvas.addEventListener('pointercancel',lookEnd);

// =========================
// ジャンプ
// =========================
function jump(){
 if(onGround&&!won){
  vel.y=9.5;
  onGround=false;
 }
}

const jumpBtn=document.querySelector('#jump');

jumpBtn.addEventListener('pointerdown',e=>{
 e.preventDefault();
 jump();
});

// =========================
// リスタート
// =========================
function reset(){
 pos.copy(checkpointPos);
 vel.set(0,0,0);
 won=false;
 msg.style.opacity=0;
}

document.querySelector('#restart').onclick=()=>{
 checkpointPos.set(0,.25,0);
 checkpointY=0;
 cpIndex=0;
 highest=0;
 reset();
};

// =========================
// ゲーム更新
// =========================
function update(dt){
 if(won)return;

 // 移動方向
 const forward=new THREE.Vector3(
  -Math.sin(yaw),0,-Math.cos(yaw)
 );

 const right=new THREE.Vector3(
  Math.cos(yaw),0,-Math.sin(yaw)
 );

 let move=new THREE.Vector3();

 move.addScaledVector(forward,-joy.y);
 move.addScaledVector(right,joy.x);

 if(keys.w||keys.arrowup)move.add(forward);
 if(keys.s||keys.arrowdown)move.sub(forward);
 if(keys.a||keys.arrowleft)move.sub(right);
 if(keys.d||keys.arrowright)move.add(right);

 if(move.length()>1)move.normalize();

 // 移動速度
 const speed=6.5;
 vel.x=move.x*speed;
 vel.z=move.z*speed;

 // 重力
 vel.y-=22*dt;
 pos.addScaledVector(vel,dt);

 // 足場着地判定
 onGround=false;

 if(vel.y<=0){
  for(const p of platforms){
   let u=p.userData;

   if(
    pos.x>u.x-u.w/2-.35&&
    pos.x<u.x+u.w/2+.35&&
    pos.z>u.z-u.d/2-.35&&
    pos.z<u.z+u.d/2+.35&&
    pos.y>=u.top-.15&&
    pos.y<=u.top+.35
   ){
    pos.y=u.top+.02;
    vel.y=0;
    onGround=true;
    break;
   }
  }
 }

 // チェックポイント更新
 for(let i=0;i<checkpoints.length;i++){
  let a=route[checkpoints[i]-1];

  if(pos.y>a[1]+.5&&checkpointY<a[1]){
   checkpointPos.set(
    a[0],a[1]+.25,a[2]
   );

   checkpointY=a[1];
   cpIndex=i+1;
  }
 }

 // 最高到達高度
 highest=Math.max(highest,pos.y);

 // 落下
 if(pos.y<-8){
  pos.copy(checkpointPos);
  vel.set(0,0,0);

  msg.textContent='もう一回！';
  msg.style.opacity=1;

  setTimeout(()=>{
   msg.style.opacity=0;
  },900);
 }

 // ゴール判定
 if(
  pos.y>last[1]+2&&
  Math.hypot(pos.x-last[0],pos.z-last[2])<4
 ){
  won=true;
  msg.textContent='🏆 GOAL!!';
  msg.style.opacity=1;
 }

 // キャラクター表示
 player.position.copy(pos);
 player.rotation.y=yaw;

 body.rotation.z=move.x*.12;

 feet[0].rotation.x=
  Math.sin(performance.now()*.01)*.2*move.length();

 feet[1].rotation.x=-feet[0].rotation.x;

 // HUD
 status.textContent=
 `高さ ${Math.max(0,Math.floor(pos.y))} m　|　CP ${cpIndex}　|　最高 ${Math.floor(highest)} m`;
}

// =========================
// カメラ
// =========================
const camTarget=new THREE.Vector3();
const camPos=new THREE.Vector3();
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);

 let dt=Math.min(clock.getDelta(),.035);

 update(dt);

 camTarget.set(
  pos.x,
  pos.y+1.35,
  pos.z
 );

 const dist=7.5;
 const cp=Math.cos(pitch);

 camPos.set(
  pos.x+Math.sin(yaw)*dist*cp,
  pos.y+2.5+Math.sin(pitch)*dist,
  pos.z+Math.cos(yaw)*dist*cp
 );

 camera.position.lerp(camPos,.14);
 camera.lookAt(camTarget);

 ring.rotation.y+=.01;

 renderer.render(scene,camera);
}

animate();

// =========================
// 画面サイズ変更
// =========================
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

})();
</script>
</body>
</html>
